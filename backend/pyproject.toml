[project]
name = "mini-hysys-backend"
version = "0.1.0"
description = "Backend for MiniHYSYS, a lightweight steady-state process simulator"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "numpy",
  "scipy"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"